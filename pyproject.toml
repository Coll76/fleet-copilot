[project]
name = "fleet-copilot"
version = "0.1.0"
description = "Agentic Fleet Copilot for Rayda device telemetry: grounded answers, trend insights and human-approved actions."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[dependency-groups]
dev = ["pytest>=8.2"]

[project.scripts]
fleet-copilot = "fleet_copilot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
