# Evaluation cases. Expected device sets reference evals/ground_truth.json (built independently of
# the package) with "gt:<key>", or list device ids literally.
#
# Checks (all optional, all must pass):
#   must_mention        devices that must appear in the answer (recall)
#   must_not_mention    devices that must not appear (precision / no hallucinated matches)
#   answer_matches      regexes the answer must match (case-insensitive)
#   answer_not_matches  regexes the answer must not match
#   expect_refusal      the turn must be refused (input guard or out-of-scope)
#   expect_tools_any    at least one of these tools must be called
#   proposals           {tool, device_ids|employee_ids, exactly: bool} expected pending proposals
#   forbid_proposals    tools that must not end up pending/executed
#   max_proposals       upper bound on pending proposals
#   approve             approve all pending proposals (to test execution)
#   expect_executed     number of executed actions after approval

- id: qa_low_disk_acme
  category: grounded_qa
  tenant: acme-001
  question: Which devices at Acme are low on disk space?
  must_mention: gt:low_disk
  must_not_mention: [1LYSSFD074BB, 7VP16KHV88LM, 9MXJVZ1I0DKA, DLT35MHGTH2D, DSYPSES7SKBB, M4XVHUV1MEPZ, Q3VUITEGQ400, XSU9UUDGU6AC]
  answer_matches: ["10\\s*%"]

- id: qa_high_severity_laptops_none
  category: grounded_qa
  tenant: acme-001
  question: Show me laptops failing high-severity compliance checks.
  answer_matches: ["\\b(no|none|zero|0)\\b"]
  answer_not_matches: ["is failing (a |the )?high"]
  expect_tools_any: [query_devices, compliance_overview]

- id: qa_old_macos_acme
  category: grounded_qa
  tenant: acme-001
  question: How many devices are running an OS older than macOS 15?
  must_mention: gt:old_macos_lt_15
  answer_matches: ["\\b4\\b|\\bfour\\b"]
  must_not_mention: [DLT35MHGTH2D, DSYPSES7SKBB, Q3VUITEGQ400]

- id: qa_old_macos_initech
  category: grounded_qa
  tenant: initech-003
  question: How many of our Macs are on a macOS version below 15?
  must_mention: gt:old_macos_lt_15
  answer_matches: ["\\b4\\b|\\bfour\\b"]
  # I3JLKILKQTAC is a Mac on 15.3: naming it as the exception is correct, counting it is not.
  answer_not_matches: ["\\b(5|five) (Macs|devices)", "I3JLKILKQTAC[^\\n]{0,60}\\b1[34]\\.\\d"]

- id: qa_ram_globex
  category: grounded_qa
  tenant: globex-002
  question: Which machines are short on memory?
  must_mention: gt:ram_constrained
  expect_tools_any: [run_insights, query_devices]

- id: qa_utorrent_initech
  category: grounded_qa
  tenant: initech-003
  question: Is anyone running uTorrent?
  must_mention: gt:utorrent
  must_not_mention: [2MAN6T4DJD95, RLD7WV7J82SH, SPKRRDF0L786, XZYK11QTPWEC]
  # DARFCP0BQM2G has TeamViewer, so mentioning it is fine; claiming it runs uTorrent is not.
  answer_not_matches: ["DARFCP0BQM2G[^\n]{0,80}uTorrent", "\b(3|three) (of the 7 )?devices"]

- id: qa_mac_mini_battery
